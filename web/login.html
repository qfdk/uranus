<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/public/icon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icon/favicon-32x32.png">
    <link rel="stylesheet" href="/public/css/tailwind.min.css">
    <title>登录 · Uranus</title>
</head>
<body class="h-full bg-slate-950">
<div class="relative flex min-h-full items-center justify-center overflow-hidden px-4 py-12">
    <!-- 背景光晕 -->
    <div class="pointer-events-none absolute left-1/2 top-[-12rem] h-[36rem] w-[36rem] -translate-x-1/2 rounded-full bg-emerald-500/20 blur-3xl"></div>
    <div class="pointer-events-none absolute inset-0 bg-[linear-gradient(to_bottom,transparent,rgba(2,6,23,0.9))]"></div>

    <div class="relative w-full max-w-sm">
        <div class="mb-8 flex flex-col items-center text-center">
            <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-white/5 ring-1 ring-white/10">
                <img src="/public/icon/nginx.png" alt="" class="h-9 w-9">
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-white">Uranus</h1>
            <p class="mt-1 text-sm text-slate-400">登录 Nginx 管理面板</p>
        </div>

        <div class="rounded-2xl bg-white p-7 shadow-2xl shadow-black/40">
            {{ if .loginError }}
            <div class="alert alert-error mb-5">
                {{ svgIcon "circle-alert" }}
                <span>用户名或密码不正确</span>
            </div>
            {{ end }}
            <form action="/login" method="post" class="space-y-5">
                <div>
                    <label for="username" class="label">用户名</label>
                    <input id="username" name="username" type="text" class="input" autocomplete="username"
                           placeholder="admin" required autofocus>
                </div>
                <div>
                    <label for="password" class="label">密码</label>
                    <input id="password" name="password" type="password" class="input"
                           autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary h-10 w-full">
                    {{ svgIcon "log-in" }}
                    登录
                </button>
            </form>
        </div>

        <p class="mt-8 text-center text-xs text-slate-500">Οὐρανός · A simple Nginx manager</p>
    </div>
</div>
</body>
</html>
