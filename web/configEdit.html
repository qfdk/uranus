{{template "header.html" .}}

<div class="page-header">
    <div>
        <h1 class="page-title">Uranus 设置</h1>
        <p class="page-desc">编辑 config.toml。保存前会检查格式，并自动备份旧文件，保存后立即生效</p>
    </div>
    <button type="button" id="saveConfig" class="btn btn-primary">{{ svgIcon "save" }}保存</button>
</div>

<div id="alert" class="alert alert-error mb-4 hidden">{{ svgIcon "circle-alert" }}<span id="message" class="whitespace-pre-wrap break-all"></span></div>
<div id="alertSuccess" class="alert alert-success mb-4 hidden">{{ svgIcon "circle-check" }}<span id="successMessage"></span></div>

<div class="editor-frame">
    <div id="editor" data-lang="toml" style="height: 500px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.31.1/min/vs/loader.js"></script>
<script>
    // TOML 语法高亮
    const tomlTokenizer = {
        defaultToken: 'invalid',
        tokenizer: {
            root: [
                [/^\s*\[.*\]\s*$/, 'metatag'],
                [/^\s*[a-zA-Z_][a-zA-Z0-9_]*\s*=/, 'key'],
                [/".*?"/, 'string'],
                [/'.*?'/, 'string'],
                [/[0-9]+/, 'number'],
                [/true|false/, 'keyword'],
                [/#.*$/, 'comment']
            ],
        }
    };

    var editor;
    require.config({
        paths: {
            vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.31.1/min/vs'
        },
        'vs/nls': {availableLanguages: {'*': 'zh-cn'}}
    });
    require(['vs/editor/editor.main'], function () {
        monaco.languages.register({id: 'toml'});
        monaco.languages.setMonarchTokensProvider('toml', tomlTokenizer);
        editor = monaco.editor.create(document.getElementById('editor'), {
            value: {{ .content }},
            language: 'toml',
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            padding: {top: 12},
            scrollbar: {
                verticalScrollbarSize: 12,
                horizontalScrollbarSize: 12
            },
            minimap: {
                enabled: false
            }
        });
        $(window).on("resize", fitEditor);
        fitEditor();
    });

    function fitEditor() {
        var height = $(window).height() - $('#editor').offset().top - 32;
        $('#editor').css('height', Math.max(400, height) + 'px');
    }

    function showAlert(ok, text) {
        $(ok ? '#successMessage' : '#message').text(text);
        $(ok ? '#alertSuccess' : '#alert').removeClass('hidden');
        $(ok ? '#alert' : '#alertSuccess').addClass('hidden');
    }

    // 保存成功时接口返回 200，格式错误或写入失败时返回 4xx/5xx 和原因
    $('#saveConfig').on('click', function () {
        var $btn = $(this).prop('disabled', true);
        $.post('/admin/config/save', {content: editor.getValue()})
            .done(function () {
                showAlert(true, '配置已保存并生效');
            })
            .fail(function (xhr, status, error) {
                showAlert(false, '保存失败：' + ((xhr.responseJSON && xhr.responseJSON.message) || error || status));
            })
            .always(function () {
                $btn.prop('disabled', false);
            });
    });
</script>

{{template "footer.html" .}}
