{{template "header.html" .}}

<div class="page-header">
    <div>
        <a href="/admin/nginx/config-info" class="back-link">{{ svgIcon "arrow-left" }}Nginx 配置</a>
        <h1 class="page-title">编辑 nginx.conf</h1>
        <p class="page-desc">保存后写入磁盘并自动重新加载 Nginx</p>
    </div>
    <div class="flex flex-wrap gap-2">
        {{ template "history-button" .configPath }}
        <button type="button" id="btnFormatterNginxConf" class="btn btn-secondary" title="快捷键 Shift+Alt+F">{{ svgIcon "align-left" }}格式化</button>
        <button type="button" id="saveNginxConf" class="btn btn-primary">{{ svgIcon "save" }}保存并重载</button>
    </div>
</div>

<div id="alert" class="alert alert-error mb-4 hidden">{{ svgIcon "circle-alert" }}<span id="message" class="min-w-0 whitespace-pre-wrap break-words"></span></div>
<div id="alertSuccess" class="alert alert-success mb-4 hidden">{{ svgIcon "circle-check" }}<span id="successMessage"></span></div>

<input type="hidden" id="filename" value="{{ .configFileName }}">
<div class="editor-frame">
    <div id="editor" data-lang="nginx" style="height: 600px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.31.1/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nginxbeautifier@1.0.19/nginxbeautifier.min.js"></script>
<script src="/public/js/editor.js"></script>
<script>
    require(['vs/editor/editor.main'], function () {
        monaco.languages.register({id: defaultLang});
        monaco.languages.setLanguageConfiguration(defaultLang, {
            autoClosingPairs: [
                {open: '{', close: '}'},
                {open: '"', close: '"'},
            ],
            comments: {
                lineComment: "#"
            }
        });
        monaco.languages.setMonarchTokensProvider(defaultLang, tokenConf);
        monaco.editor.defineTheme(themeConfig.base, themeConfig);
        editor = monaco.editor.create(document.getElementById('editor'), {
            value: {{ .content }},
            language: defaultLang,
            theme: defaultTheme,
            fontSize: 14,
            automaticLayout: true,
            padding: {top: 12},
            scrollbar: {
                verticalScrollbarSize: 12,
                horizontalScrollbarSize: 12
            },
            minimap: {
                enabled: true
            }
        });
        // 格式化
        monaco.languages.registerDocumentFormattingEditProvider(defaultLang, {
            provideDocumentFormattingEdits: function (model) {
                return [{
                    text: nginxFormatter(model.getValue()),
                    range: model.getFullModelRange()
                }];
            }
        });
        // 编辑器占满窗口剩余高度
        $(window).on("resize", fitEditor);
        fitEditor();
        setupHistory();
    });

    function fitEditor() {
        var height = $(window).height() - $('#editor').offset().top - 32;
        $('#editor').css('height', Math.max(420, height) + 'px');
    }
</script>

{{ template "history-modal" }}

{{template "footer.html" .}}
