<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .hostname }} · 终端</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #1d1d1d;
            --panel: #2a2a2a;
            --line: #3a3a3a;
            --fg: #f2f4f8;
            --muted: #a8a8a8;
        }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
        }
        #terminal {
            position: absolute;
            inset: 8px;
            overflow: hidden;
        }
        #search {
            position: fixed;
            top: 10px;
            right: 18px;
            z-index: 10;
            display: none;
            align-items: center;
            gap: 2px;
            height: 34px;
            padding: 0 4px 0 10px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--panel);
            color: var(--fg);
            font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            box-shadow: 0 6px 20px rgb(0 0 0 / 0.35);
        }
        #search.open {
            display: flex;
        }
        #search input {
            width: 170px;
            border: 0;
            outline: 0;
            background: transparent;
            color: inherit;
            font: inherit;
        }
        #search input::placeholder {
            color: var(--muted);
        }
        #search output {
            min-width: 44px;
            padding: 0 6px;
            color: var(--muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        #search button {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }
        #search button:hover {
            background: var(--line);
            color: var(--fg);
        }
        #search svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
<div id="terminal"></div>

<div id="search" role="search">
    <input type="text" placeholder="在终端里查找" aria-label="在终端里查找" autocomplete="off" spellcheck="false">
    <output aria-live="polite"></output>
    <button type="button" data-action="previous" title="上一个（↵）" aria-label="上一个">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <button type="button" data-action="next" title="下一个（⇧↵）" aria-label="下一个">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button type="button" data-action="close" title="关闭（Esc）" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
</div>

<script type="module" src="/public/js/terminal.js"></script>
</body>
</html>
